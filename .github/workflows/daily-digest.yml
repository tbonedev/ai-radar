name: Daily AI Radar

on:
  schedule:
    # 07:00 UTC = 00:00 PDT / 23:00 PST — digest is ready before the day starts.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    # The `secrets` context is not available in a step-level `if` — referencing it
    # there fails to parse the whole workflow. Lift it to a job-level env var and
    # test that instead; `env` is available in `if`.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Default provider is claude-cli, which runs on a Claude subscription
      # (secret CLAUDE_CODE_OAUTH_TOKEN, produced locally by `claude setup-token`)
      # instead of a metered API key. Skipped when a different provider is chosen.
      - name: Install Claude Code CLI
        if: ${{ (vars.LLM_PROVIDER || 'claude-cli') == 'claude-cli' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pick the provider with the repo variable LLM_PROVIDER
          # (claude-cli | anthropic | openai | openrouter | deepseek | github-copilot)
          # and set the matching secret below. Only one is needed.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude-cli' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_CLI_CONCURRENCY: ${{ vars.CLAUDE_CLI_CONCURRENCY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Optional — without it the Product Hunt section is simply skipped.
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      # The digest issue is opened by `pnpm start` above and links to the report
      # files committed here, so a failed push publishes an issue whose links
      # 404. The runner intermittently fails TLS verification on push
      # ("server certificate verification failed. CAfile: none"), so retry
      # rather than leaving the day's issue pointing at nothing.
      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
            exit 0
          fi
          git commit -m "digest: $(date -u +%Y-%m-%d) daily digest"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::could not push digest files — today's issue links will 404"
          exit 1

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update manifest.json"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::could not push manifest"
          exit 1

      - name: Send Telegram notification
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://tbonedev.github.io/ai-radar
        run: pnpm notify

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
