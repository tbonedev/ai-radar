# ai-radar configuration (fork of duanyytop/agents-radar)
#
# Tuned for two things at once:
#   1. bleeding edge  — AI coding CLIs, MCP ecosystem, agent skills
#   2. own stack      — Dify / LiteLLM / Chatwoot / Meilisearch release watch
#
# Edit this file to customize which repositories are tracked.
# Changes take effect on the next workflow run.
# NOTE: an empty list falls back to the upstream defaults (see src/config.ts) —
# to drop a section, shrink it, never blank it.

# ── AI coding CLIs / agent harnesses ─────────────────────────────────────────
# Each entry requires: id (filename slug), repo (owner/repo), name (display name).
# Set paginated: true for high-volume repos with many daily updates.

cli_repos:
  - id: claude-code
    repo: anthropics/claude-code
    name: Claude Code
    paginated: true
  - id: codex
    repo: openai/codex
    name: OpenAI Codex
    paginated: true
  - id: gemini-cli
    repo: google-gemini/gemini-cli
    name: Gemini CLI
  - id: copilot-cli
    repo: github/copilot-cli
    name: GitHub Copilot CLI
  - id: opencode
    repo: anomalyco/opencode
    name: OpenCode
    paginated: true
  - id: cline
    repo: cline/cline
    name: Cline
  - id: qwen-code
    repo: QwenLM/qwen-code
    name: Qwen Code

# ── Claude Code Skills ────────────────────────────────────────────────────────
# Tracked separately without a date filter, sorted by community engagement.

skills_repo: anthropics/skills

# ── Primary focus: MCP ────────────────────────────────────────────────────────
# Gets a dedicated deep-dive report. The `openclaw` key name is upstream's;
# the slot is generic — whatever sits here is the deep-dive subject.

openclaw:
  id: mcp-servers
  repo: modelcontextprotocol/servers
  name: MCP Servers
  paginated: true

# ── MCP / skills ecosystem ────────────────────────────────────────────────────
# Tracked alongside the focus project for cross-ecosystem comparison.
# Awesome-lists are included on purpose: their merged PRs ARE the "what's new"
# feed — every new MCP server or skill lands here as a PR first.

openclaw_peers:
  - id: mcp-registry-official
    repo: modelcontextprotocol/registry
    name: MCP Registry (official)
  - id: awesome-mcp-servers
    repo: punkpeye/awesome-mcp-servers
    name: Awesome MCP Servers
    paginated: true
  - id: mcp-registry-docker
    repo: docker/mcp-registry
    name: Docker MCP Registry
  - id: claude-plugins
    repo: anthropics/claude-plugins-official
    name: Claude Plugins (official)
  - id: awesome-claude-code
    repo: hesreallyhim/awesome-claude-code
    name: Awesome Claude Code
    paginated: true
  - id: awesome-agent-skills
    repo: VoltAgent/awesome-agent-skills
    name: Awesome Agent Skills

# ── Infrastructure ────────────────────────────────────────────────────────────
# Half bleeding-edge inference layer, half this project's own dependencies —
# so a breaking release lands in the digest instead of in production.

infra_repos:
  - id: dify
    repo: langgenius/dify
    name: Dify
    paginated: true
  - id: litellm
    repo: BerriAI/litellm
    name: LiteLLM
    paginated: true
  - id: chatwoot
    repo: chatwoot/chatwoot
    name: Chatwoot
  - id: meilisearch
    repo: meilisearch/meilisearch
    name: Meilisearch
  - id: ollama
    repo: ollama/ollama
    name: Ollama
  - id: vllm
    repo: vllm-project/vllm
    name: vLLM
    paginated: true
